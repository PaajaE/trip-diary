name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Services the app and tests never use. Skipping them saves pulling several
# large images on every run (CLI still needs kong, postgrest, storage, auth).
# E2E additionally needs edge-runtime (translate-entry edge function).
env:
  SUPABASE_EXCLUDE: studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
  SUPABASE_EXCLUDE_E2E: studio,imgproxy,mailpit,realtime,logflare,vector,supavisor

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'supabase/**'
              - 'src/shared/api/database.types.ts'
              - 'scripts/patch-database-types.mjs'
              - '.github/workflows/ci.yml'

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packages
      - run: pnpm check

  # Database checks run on every push to main and on PRs that touch the database.
  # The job itself always runs (a skipped required check never triggers
  # auto-merge); without database changes it passes after the first step.
  database-security:
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN_DB: ${{ github.event_name != 'pull_request' || needs.changes.outputs.database == 'true' }}
    steps:
      - if: env.RUN_DB != 'true'
        run: echo "No database changes in this PR, skipping database checks."
      - if: env.RUN_DB == 'true'
        uses: actions/checkout@v4
      - if: env.RUN_DB == 'true'
        uses: pnpm/action-setup@v4
      - if: env.RUN_DB == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: env.RUN_DB == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - if: env.RUN_DB == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.RUN_DB == 'true'
        run: supabase start -x "$SUPABASE_EXCLUDE"
      - if: env.RUN_DB == 'true'
        run: pnpm db:lint
      - if: env.RUN_DB == 'true'
        run: pnpm db:test
      - if: env.RUN_DB == 'true'
        run: pnpm db:types
      - if: env.RUN_DB == 'true'
        run: git diff --exit-code -- src/shared/api/database.types.ts
