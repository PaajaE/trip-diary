name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Services the app and tests never use. Skipping them saves pulling several
# large images on every run (CLI still needs kong, postgrest, storage, auth).
# E2E additionally needs edge-runtime (translate-entry edge function).
env:
  SUPABASE_EXCLUDE: studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor
  SUPABASE_EXCLUDE_E2E: studio,imgproxy,mailpit,realtime,logflare,vector,supavisor

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'supabase/**'
              - 'src/shared/api/database.types.ts'
              - 'scripts/patch-database-types.mjs'
              - '.github/workflows/ci.yml'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packages
      - run: pnpm check

  # Database checks run on every push to main and on PRs that touch the database.
  database-security:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x "$SUPABASE_EXCLUDE"
      - run: pnpm db:lint
      - run: pnpm db:test
      - run: pnpm db:types
      - run: git diff --exit-code -- src/shared/api/database.types.ts

  # End-to-end tests cover v1 screens that v2 replaces; they gate main and can be
  # run on demand (Actions → CI → Run workflow) instead of blocking every PR.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x "$SUPABASE_EXCLUDE_E2E"
      - name: Configure local Supabase env
        run: |
          supabase status --output json > /tmp/supabase-status.json
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const status = JSON.parse(readFileSync('/tmp/supabase-status.json', 'utf8'));
            writeFileSync('.env.local', \`VITE_SUPABASE_URL=\${status.API_URL}\\nVITE_SUPABASE_ANON_KEY=\${status.ANON_KEY}\\n\`);
            writeFileSync(
              process.env.GITHUB_ENV,
              \`VITE_SUPABASE_URL=\${status.API_URL}\\nVITE_SUPABASE_ANON_KEY=\${status.ANON_KEY}\\n\`,
              { flag: 'a' },
            );
          "
      - run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop-chromium tests/e2e/offline-capture.spec.ts tests/e2e/moment-cover-selection.spec.ts tests/e2e/public-moment-ordering.spec.ts tests/e2e/entry-translation.spec.ts
      - name: Print Playwright failure context
        if: failure()
        run: find test-results -name 'error-context.md' -print -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
