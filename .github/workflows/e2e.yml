name: E2E

# Runs separately from CI so that registry rate limits on the Supabase
# images (seen on GitHub runners) never block the production deploy,
# which waits only for CI (quality, database-security).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_EXCLUDE_E2E: studio,imgproxy,mailpit,realtime,logflare,vector,supavisor

jobs:
  # End-to-end tests run on every push to main and on demand (Actions → E2E →
  # Run workflow); they do not block the deploy.
  e2e:
    runs-on: ubuntu-24.04 # Playwright has no Chromium for ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (retries on registry rate limits)
        env:
          # ghcr.io rate-limits the e2e image set; the ECR mirror does not.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        run: |
          for attempt in 1 2 3 4; do
            if supabase start -x "$SUPABASE_EXCLUDE_E2E"; then exit 0; fi
            echo "supabase start failed (attempt $attempt), retrying in $((attempt * 30)) s"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Configure local Supabase env
        run: |
          supabase status --output json > /tmp/supabase-status.json
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const status = JSON.parse(readFileSync('/tmp/supabase-status.json', 'utf8'));
            writeFileSync('.env.local', \`VITE_SUPABASE_URL=\${status.API_URL}\\nVITE_SUPABASE_ANON_KEY=\${status.ANON_KEY}\\n\`);
            writeFileSync(
              process.env.GITHUB_ENV,
              \`VITE_SUPABASE_URL=\${status.API_URL}\\nVITE_SUPABASE_ANON_KEY=\${status.ANON_KEY}\\n\`,
              { flag: 'a' },
            );
          "
      - run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop-chromium tests/e2e/v2-journey.spec.ts
      - name: Print Playwright failure context
        if: failure()
        run: find test-results -name 'error-context.md' -print -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
