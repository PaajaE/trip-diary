name: E2E

# Runs separately from CI so that registry rate limits on the Supabase
# images (seen on GitHub runners) never block the production deploy,
# which waits only for CI (quality, database-security).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_EXCLUDE_E2E: studio,imgproxy,mailpit,realtime,logflare,vector,supavisor

jobs:
  # End-to-end tests run on every push to main and on demand (Actions → E2E →
  # Run workflow); they do not block the deploy.
  e2e:
    runs-on: ubuntu-24.04 # Playwright has no Chromium for ubuntu-latest (26.04) yet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: pnpm install --frozen-lockfile
      # Registries rate-limit anonymous pulls from shared GitHub runner IPs
      # (ghcr.io and public.ecr.aws both did). The image set is pinned by the
      # CLI version, so keep it in the Actions cache and only pull on a miss.
      - name: Restore Supabase images
        id: images
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images.tar.gz
          key: supabase-images-${{ hashFiles('.github/workflows/e2e.yml', 'supabase/config.toml') }}
      - name: Load cached Supabase images
        if: steps.images.outputs.cache-hit == 'true'
        run: gunzip -c "$RUNNER_TEMP/supabase-images.tar.gz" | docker load
      # The CLI pulls anonymously, which ghcr.io and public.ecr.aws throttle on
      # shared runner IPs. Pull the pinned images ourselves with an
      # authenticated ghcr.io login; supabase start skips images found locally.
      # Versions match `supabase services` for CLI 2.75.0 (kong is not listed).
      - name: Pull Supabase images (authenticated ghcr.io)
        if: steps.images.outputs.cache-hit != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          pids=()
          for image in postgres:17.6.1.075 gotrue:v2.186.0 postgrest:v14.3 \
            storage-api:v1.35.3 edge-runtime:v1.70.0 postgres-meta:v0.95.2 kong:2.8.1; do
            (for attempt in 1 2 3 4 5; do
              docker pull -q "ghcr.io/supabase/$image" && exit 0
              sleep $((attempt * 15))
            done; exit 1) &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Start local Supabase (retries on registry rate limits)
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          for attempt in 1 2 3 4; do
            if supabase start -x "$SUPABASE_EXCLUDE_E2E"; then exit 0; fi
            echo "supabase start failed (attempt $attempt), retrying in $((attempt * 30)) s"
            supabase stop --no-backup || true
            sleep $((attempt * 30))
          done
          exit 1
      - name: Save Supabase images
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep '^ghcr.io/supabase/' \
            | xargs docker save | gzip -1 > "$RUNNER_TEMP/supabase-images.tar.gz"
      - name: Store Supabase images in cache
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/supabase-images.tar.gz
          key: ${{ steps.images.outputs.cache-primary-key }}
      - name: Configure local Supabase env
        run: |
          supabase status --output json > /tmp/supabase-status.json
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const status = JSON.parse(readFileSync('/tmp/supabase-status.json', 'utf8'));
            writeFileSync('.env.local', \`VITE_SUPABASE_URL=\${status.API_URL}\\nVITE_SUPABASE_ANON_KEY=\${status.ANON_KEY}\\n\`);
            writeFileSync(
              process.env.GITHUB_ENV,
              \`VITE_SUPABASE_URL=\${status.API_URL}\\nVITE_SUPABASE_ANON_KEY=\${status.ANON_KEY}\\n\`,
              { flag: 'a' },
            );
          "
      - run: PLAYWRIGHT_BROWSERS_PATH=0 pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=desktop-chromium tests/e2e/v2-journey.spec.ts
      - name: Print Playwright failure context
        if: failure()
        run: find test-results -name 'error-context.md' -print -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
