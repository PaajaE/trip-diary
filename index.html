<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="theme-color" content="#285845" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Cestovní deník – mapa, fotky a příběh každé cesty</title>
    <meta
      name="description"
      content="Fotky a videa se řadí na mapu a do času, vy dopíšete příběh. Cestovní deník pro rodinu a přátele, na mobilu i na počítači."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trip Diary" />
    <meta
      property="og:title"
      content="Cestovní deník – mapa, fotky a příběh každé cesty"
    />
    <meta
      property="og:description"
      content="Fotky a videa se řadí na mapu a do času, vy dopíšete příběh. Cestovní deník pro rodinu a přátele, na mobilu i na počítači."
    />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:locale:alternate" content="en_US" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const redirect = window.location.search
        if (!redirect.startsWith('?/')) {
          return
        }
        const route = redirect
          .slice(2)
          .split('&')
          .map((part) => part.replaceAll('~and~', '&'))
          .join('?')
        window.history.replaceState(
          null,
          '',
          window.location.pathname.replace(/\/$/, '') + '/' + route,
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
